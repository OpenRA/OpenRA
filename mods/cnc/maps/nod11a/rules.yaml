World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, nod11a.lua, nod11a-AI.lua
	MusicPlaylist:
		StartingMusic: march
		VictoryMusic: nod_win1
	MissionData:
		Briefing: briefing
		StartVideo: stealth.vqa
		LossVideo: deskill.vqa
		WinVideo: obel.vqa
		BriefingVideo: nod11.vqa
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal
	MapBuildRadius:
		BuildRadiusCheckboxEnabled: False
	-LegacyBridgeLayer:

Player:
	EnemyWatcher:
	PlayerResources:
		DefaultCash: 2000
	LobbyPrerequisiteCheckbox@GLOBALFACTUNDEPLOY:
		Enabled: True

FACT:
	AnnounceOnSeen:

HARV:
	Harvester:
		SearchFromProcRadius: 30
		SearchFromHarvesterRadius: 20

BOAT.easy:
	Inherits: BOAT
	RenderSprites:
		Image: boat
	Armament:
		Weapon: BoatMissile.easy

ARTY:
	ExternalCondition@DIFFICULTY-EASY:
		Condition: difficulty-easy
	ExternalCondition@DIFFICULTY-NORMAL:
		Condition: difficulty-normal
	ExternalCondition@DIFFICULTY-HARD:
		Condition: difficulty-hard
	RevealsShroud@DIFFICULTY-EASY:
		RequiresCondition: difficulty-easy
		Range: 8c0
	RevealsShroud@DIFFICULTY-NORMAL:
		RequiresCondition: difficulty-normal
		Range: 7c0
	RevealsShroud@DIFFICULTY-HARD:
		RequiresCondition: difficulty-hard
		Range: 7c0

# The Obelisk normally needs the Temple of Nod, which is disabled here
# (nuclear strike). Require a Communications Center instead.
OBLI:
	Buildable:
		Prerequisites: anyhq, ~techlevel.high

HPAD:
	Buildable:
		Prerequisites: ~disabled

