STNK:
	Buildable:
		Prerequisites: ~ezekiel
	RevealsShroud:
		Range: 8c0
	Armament@PRIMARY:
		Weapon: 227mm.stnk.mission
	Armament@SECONDARY:
		Weapon: 227mm.stnkAA.mission

A10.IN:
