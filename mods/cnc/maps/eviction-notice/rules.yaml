World:
	MissionData:
		StartVideo: consyard.vqa
		LossVideo: bombaway.vqa
		WinVideo: inferno.vqa
		Briefing: briefing
	# Original [Basic] has Theme=No theme, so there is no starting music.
	# The engine default victory music is GDI's; Nod missions set their own.
	MusicPlaylist:
		VictoryMusic: nod_win1
	LuaScript:
		Scripts: campaign.lua, utils.lua, campaign-ai.lua, eviction-notice.lua, eviction-notice-AI.lua
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal
	MapBuildRadius:
		BuildRadiusCheckboxEnabled: False

Player:
	EnemyWatcher:
	PlayerResources:
		DefaultCash: 0

# Village buildings are scenery in this mission and must not block the narrow
# streets with husks.
V19:
	-SpawnActorOnDeath:

V20:
	-SpawnActorOnDeath:

V21:
	-SpawnActorOnDeath:

V22:
	-SpawnActorOnDeath:

V23:
	-SpawnActorOnDeath:

V24:
	-SpawnActorOnDeath:

V25:
	-SpawnActorOnDeath:

V26:
	-SpawnActorOnDeath:

V27:
	-SpawnActorOnDeath:

V28:
	-SpawnActorOnDeath:

V29:
	-SpawnActorOnDeath:

V30:
	-SpawnActorOnDeath:

V31:
	-SpawnActorOnDeath:

C5:
	AnnounceOnSeen:
	# The two runners are deliberately a little slower than regular infantry,
	# so the player has a fair chance to intercept them before they reach GDI.
	Mobile:
		Speed: 40

C8:
	AnnounceOnSeen:
	Mobile:
		Speed: 40

# Initial flame tanks can't move if they leave a husk behind.
FTNK.nohusk:
	Inherits: FTNK
	-Buildable:
	RenderSprites:
		Image: FTNK
	-SpawnActorOnDeath:

# The HQ must not grant Nod a usable AirstrikePower when captured. Scripted
# GDI strikes use dedicated proxy actors instead.
HQ:
	-AirstrikePower:

# `bomb` is a single astk2 strike (3 A10); `owi2` and `astk` are single planes.
airstrike.proxy:
	AirstrikePower:
		SquadSize: 3

airstrike.single:
	Inherits: airstrike.proxy
	AirstrikePower:
		SquadSize: 1

A10:
	Targetable:

FLARE:
	RevealsShroud:
		Range: 5c0

CAMERA:
	RevealsShroud:
		Range: 5c0
