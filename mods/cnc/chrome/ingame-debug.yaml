Container@DEBUG_PANEL:
	Logic: DebugMenuLogic
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		Label@TITLE:
			Y: 16
			Font: Bold
			Text: label-debug-panel-title
			Align: Center
			Width: PARENT_WIDTH
			Height: 20
		Row@CHEATS_COLUMNS:
			X: 45
			Y: 45
			Width: PARENT_WIDTH - 90
			Height: 75
			Spacing: 45
			Children:
				Column@CHEATS_COL_LEFT:
					Width: 200
					Spacing: 10
					Children:
						Checkbox@INSTANT_BUILD:
							Width: PARENT_WIDTH
							Height: 20
							Font: Regular
							Text: checkbox-debug-panel-instant-build
						Checkbox@ENABLE_TECH:
							Width: PARENT_WIDTH
							Height: 20
							Font: Regular
							Text: checkbox-debug-panel-enable-tech
						Checkbox@BUILD_ANYWHERE:
							Width: PARENT_WIDTH
							Height: 20
							Font: Regular
							Text: checkbox-debug-panel-build-anywhere
				Column@CHEATS_COL_RIGHT:
					Width: 200
					Spacing: 10
					Children:
						Checkbox@UNLIMITED_POWER:
							Width: PARENT_WIDTH
							Height: 20
							Font: Regular
							Text: checkbox-debug-panel-unlimited-power
						Checkbox@INSTANT_CHARGE:
							Width: PARENT_WIDTH
							Height: 20
							Font: Regular
							Text: checkbox-debug-panel-instant-charge
						Checkbox@DISABLE_VISIBILITY_CHECKS:
							Width: PARENT_WIDTH
							Height: 20
							Font: Regular
							Text: checkbox-debug-panel-disable-visibility-checks
		Row@CASH_BUTTONS_ROW:
			X: 45
			Y: 145
			Width: PARENT_WIDTH - 90
			Height: 35
			Spacing: 41
			Children:
				Button@GIVE_CASH:
					Width: 140
					Height: 35
					Text: button-debug-panel-give-cash
				Button@GROW_RESOURCES:
					Width: 140
					Height: 35
					Text: button-debug-panel-grow-resources
		Row@EXPLORATION_BUTTONS_ROW:
			X: 45
			Y: 195
			Width: PARENT_WIDTH - 90
			Height: 35
			Spacing: 41
			Children:
				Button@GIVE_EXPLORATION:
					Width: 140
					Height: 35
					Text: button-debug-panel-give-exploration
				Button@RESET_EXPLORATION:
					Width: 140
					Height: 35
					Text: button-debug-panel-reset-exploration
		Label@VISUALIZATIONS_TITLE:
			Y: 246
			Font: Bold
			Text: label-debug-panel-visualizations-title
			Align: Center
			Width: PARENT_WIDTH
			Height: 20
		Row@VISUALIZATIONS_COLUMNS:
			X: 45
			Y: 275
			Width: PARENT_WIDTH - 90
			Height: 110
			Spacing: 45
			Children:
				Column@VIS_COL_LEFT:
					Width: 200
					Spacing: 10
					Children:
						Checkbox@SHOW_UNIT_PATHS:
							Width: PARENT_WIDTH
							Height: 20
							Font: Regular
							Text: checkbox-debug-panel-show-unit-paths
						Checkbox@SHOW_CUSTOMTERRAIN_OVERLAY:
							Width: PARENT_WIDTH
							Height: 20
							Font: Regular
							Text: checkbox-debug-panel-show-customterrain-overlay
						Checkbox@SHOW_ACTOR_TAGS:
							Width: PARENT_WIDTH
							Height: 20
							Font: Regular
							Text: checkbox-debug-panel-show-actor-tags
				Column@VIS_COL_RIGHT:
					Width: 200
					Spacing: 10
					Children:
						Checkbox@SHOW_COMBATOVERLAY:
							Width: PARENT_WIDTH
							Height: 20
							Font: Regular
							Text: checkbox-debug-panel-show-combatoverlay
						Checkbox@SHOW_GEOMETRY:
							Width: PARENT_WIDTH
							Height: 20
							Font: Regular
							Text: checkbox-debug-panel-show-geometry
						Checkbox@SHOW_TERRAIN_OVERLAY:
							Width: PARENT_WIDTH
							Height: 20
							Font: Regular
							Text: checkbox-debug-panel-show-terrain-overlay
						Checkbox@SHOW_SCREENMAP:
							Width: PARENT_WIDTH
							Height: 20
							Font: Regular
							Text: checkbox-debug-panel-show-screenmap
