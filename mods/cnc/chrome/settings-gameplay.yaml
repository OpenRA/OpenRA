Container@GAMEPLAY_PANEL:
	Logic: GameplaySettingsLogic
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		ScrollPanel@SETTINGS_SCROLLPANEL:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			CollapseHiddenChildren: True
			TopBottomSpacing: 5
			ItemSpacing: 10
			Children:
				Background@PROFILE_SECTION_HEADER:
					X: 5
					Width: PARENT_WIDTH - 24 - 10
					Height: 13
					Background: separator
					ClickThrough: True
					Children:
						Label@LABEL:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Font: TinyBold
							Align: Center
							Text: label-profile-section-header
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@PLAYER_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								LabelForInput@PLAYER:
									Width: PARENT_WIDTH
									Height: 20
									Text: label-player-container
									For: PLAYERNAME
								TextField@PLAYERNAME:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									MaxLength: 16
									Text: Name
						Container@PLAYERCOLOR_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								LabelForInput@COLOR:
									Width: PARENT_WIDTH
									Height: 20
									Text: label-playercolor-container-color
									For: PLAYERCOLOR
								DropDownButton@PLAYERCOLOR:
									Y: 25
									Width: 75
									Height: 25
									IgnoreChildMouseOver: true
									PanelAlign: Right
									Children:
										ColorBlock@COLORBLOCK:
											X: 5
											Y: 6
											Width: PARENT_WIDTH - 35
											Height: PARENT_HEIGHT - 12
				Container@SPACER:
				Background@FORUM_SECTION_HEADER:
					X: 5
					Width: PARENT_WIDTH - 24 - 10
					Height: 13
					Background: separator
					ClickThrough: True
					Children:
						Label@LABEL:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Font: TinyBold
							Align: Center
							Text: label-forum-profile-section-header
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 10
					Children:
						Label@DESC:
							X: 10
							Width: PARENT_WIDTH - 20
							Height: 10
							Text: label-forum-profile-description
							Font: Small
							Align: Center
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						LogicTicker@FORUM_PROFILE_TICKER:
						Container@USERNAME_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								LabelForInput:
									Width: PARENT_WIDTH
									Height: 20
									Text: label-forum-profile-username
									For: USERNAME
								TextField@USERNAME:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
						Container@PASSWORD_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								LabelForInput:
									Width: PARENT_WIDTH
									Height: 20
									Text: label-forum-profile-password
									For: PASSWORD
								PasswordField@PASSWORD:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 25
					Children:
						Label@PROFILE_STATUS:
							X: 10
							Width: PARENT_WIDTH - 280
							Height: 25
							Font: Small
						Label@CHECKING_FINGERPRINT:
							X: 10
							Width: PARENT_WIDTH - 280
							Height: 25
							Font: Small
							Text: label-forum-profile-checking-fingerprint
						Label@CONNECTION_ERROR:
							X: 10
							Width: PARENT_WIDTH - 280
							Height: 25
							Font: Small
							Text: label-forum-profile-connection-error
						Button@FORUM_BUTTON:
							X: PARENT_WIDTH - 283
							Width: 128
							Height: 25
							Text: button-forum-visit-forum
							Font: Bold
						Button@RETRY_BUTTON:
							X: PARENT_WIDTH - 145
							Width: 135
							Height: 25
							Font: Bold
							Text: button-forum-profile-retry
						Button@LINK_BUTTON:
							X: PARENT_WIDTH - 145
							Width: 135
							Height: 25
							Font: Bold
				Container@SPACER:
				Background@GAMEPLAY_SECTION_HEADER:
					X: 5
					Width: PARENT_WIDTH - 24 - 10
					Height: 13
					Background: separator
					ClickThrough: True
					Children:
						Label@LABEL:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Font: TinyBold
							Align: Center
							Text: label-gameplay-section-header
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@AUTO_SAVE_INTERVAL_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								LabelForInput@AUTO_SAVE_INTERVAL_DROP_DOWN_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: label-auto-save-interval
									For: AUTO_SAVE_INTERVAL_DROP_DOWN
								DropDownButton@AUTO_SAVE_INTERVAL_DROP_DOWN:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									Font: Regular
						Container@AUTO_SAVE_NO_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								LabelForInput@AUTO_SAVE_FILE_NUMBER_DROP_DOWN_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: label-auto-save-max-file-number
									For: AUTO_SAVE_FILE_NUMBER_DROP_DOWN
								DropDownButton@AUTO_SAVE_FILE_NUMBER_DROP_DOWN:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									Font: Regular
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 20
					Children:
						Container@HIDE_REPLAY_CHAT_CHECKBOX_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 10
							Children:
								Checkbox@HIDE_REPLAY_CHAT_CHECKBOX:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: checkbox-hide-replay-chat-container
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 20
					Children:
						Container@JUMP_TO_GROUP_SELECTS_CHECKBOX_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@JUMP_TO_GROUP_SELECTS_CHECKBOX:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: checkbox-jump-to-group-selects-container
