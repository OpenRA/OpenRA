		BriefingVideo: ally12.vqa
		StartVideo: assess.vqa
		WinVideo: aftrmath.vqa
		LossVideo: frozen.vqa
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
