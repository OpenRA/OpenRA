ScrollPanel@MULTIPLAYER_CLIENT_LIST:
	Width: PARENT_WIDTH
	Height: 159
	IgnoreChildMouseOver: true
	Children:
		ScrollItem@HEADER:
			Background: scrollheader
			Width: PARENT_WIDTH - 27
			Height: 13
			X: 2
			Y: 0
			Visible: false
			Children:
				Label@LABEL:
					Font: TinyBold
					Width: PARENT_WIDTH
					Height: 13
					Align: Center
		ScrollItem@TEMPLATE:
			Width: PARENT_WIDTH - 27
			Height: 25
			X: 2
			Y: 0
			Visible: false
			Children:
				Image@FLAG:
					X: 4
					Y: 2
					Width: 32
					Height: 16
					Visible: False
				Label@LABEL:
					X: 35
					Width: PARENT_WIDTH - 45
					Height: 25
					Shadow: True
				Label@NOFLAG_LABEL:
					X: 5
					Width: PARENT_WIDTH
					Height: 25

ScrollPanel@MULTIPLAYER_FILTER_PANEL:
	Width: 158
	Height: 130
	Children:
		Column@FILTER_CHECKBOXES:
			X: 5
			Y: 5
			Width: PARENT_WIDTH - 29
			Spacing: 5
			Children:
				Checkbox@WAITING_FOR_PLAYERS:
					Width: PARENT_WIDTH
					Height: 20
					Text: checkbox-multiplayer-filter-panel-waiting-for-players
					TextColor: 32CD32
					Font: Regular
				Checkbox@EMPTY:
					Width: PARENT_WIDTH
					Height: 20
					Text: checkbox-multiplayer-filter-panel-empty
					Font: Regular
				Checkbox@PASSWORD_PROTECTED:
					Width: PARENT_WIDTH
					Height: 20
					Text: checkbox-multiplayer-filter-panel-password-protected
					TextColor: FF0000
					Font: Regular
				Checkbox@ALREADY_STARTED:
					Width: PARENT_WIDTH
					Height: 20
					Text: checkbox-multiplayer-filter-panel-already-started
					TextColor: FFA500
					Font: Regular
				Checkbox@INCOMPATIBLE_VERSION:
					Width: PARENT_WIDTH
					Height: 20
					Text: checkbox-multiplayer-filter-panel-incompatible-version
					TextColor: BEBEBE
					Font: Regular
