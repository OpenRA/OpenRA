Container@INGAME_MENU:
	Width: WINDOW_WIDTH
	Height: WINDOW_HEIGHT
	Logic: IngameMenuLogic
		Buttons: RESUME, LOAD_GAME, SAVE_GAME, SETTINGS, MUSIC, SURRENDER, RESTART, BACK_TO_EDITOR, ABORT_MISSION, SAVE_MAP, PLAY_MAP, EXIT_EDITOR
		ButtonStride: 0, 40
	Children:
		Label@VERSION_LABEL:
			Logic: VersionLabelLogic
			X: WINDOW_WIDTH - 10
			Y: WINDOW_HEIGHT - 19
			Align: Right
			Font: Regular
			Contrast: True
		Container@PANEL_ROOT:
		Background@MENU_BUTTONS:
			X: 13 + (WINDOW_WIDTH - 522) / 4 - WIDTH / 2
			Y: (WINDOW_HEIGHT - HEIGHT) / 2
			Width: 200
			Height: 370
			ClickThrough: True
			Children:
				Column@BUTTONS_COLUMN:
					Width: PARENT_WIDTH
					Height: PARENT_HEIGHT
					CrossAxisAlignment: Center
					MainAxisAlignment: Center
					Spacing: 10
					Children:
						Label@LABEL_TITLE:
							Width: 200
							Height: 30
							Text: label-menu-buttons-title
							Align: Center
							Font: Bold
						Button@BUTTON_TEMPLATE:
							Width: 140
							Height: 30
							Font: Bold
