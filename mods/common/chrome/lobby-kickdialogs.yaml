Background@KICK_CLIENT_DIALOG:
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Logic: KickClientLogic
	Background: dialog3
	Children:
		Label@TITLE:
			Y: 41
			Width: PARENT_WIDTH
			Height: 25
			Font: Bold
			Align: Center
		Label@TEXTA:
			Y: 68
			Width: PARENT_WIDTH
			Height: 25
			Font: Regular
			Align: Center
			Text: label-kick-client-dialog-text-a
		Label@TEXTB:
			Y: 86
			Width: PARENT_WIDTH
			Height: 25
			Font: Regular
			Align: Center
			Text: label-kick-client-dialog-text-b
		Checkbox@PREVENT_REJOINING_CHECKBOX:
			X: (PARENT_WIDTH - WIDTH) / 2
			Y: 120
			Width: 150
			Height: 20
			Text: checkbox-kick-client-dialog-prevent-rejoining
		Row@BUTTON_ROW:
			X: (PARENT_WIDTH - 270) / 2
			Y: 155
			Width: 270
			Height: 25
			MainAxisAlignment: SpaceBetween
			Children:
				Button@CANCEL_BUTTON:
					Width: 120
					Height: 25
					Text: button-cancel
					Font: Bold
				Button@OK_BUTTON:
					Width: 120
					Height: 25
					Text: button-kick-client-dialog
					Font: Bold

