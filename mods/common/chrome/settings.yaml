Background@SETTINGS_PANEL:
	Logic: SettingsLogic
		ButtonStride: 0, 35
		Panels:
			GAMEPLAY_PANEL: button-panel-gameplay
			INPUT_PANEL: button-panel-input
			DISPLAY_PANEL: button-panel-display
			AUDIO_PANEL: button-panel-audio
			HOTKEYS_PANEL: button-panel-hotkeys
			ADVANCED_PANEL: button-panel-advanced
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 900
	Height: 600
	Children:
		Label@SETTINGS_LABEL_TITLE:
			Y: 20
			Width: PARENT_WIDTH
			Height: 25
			Text: button-settings-title
			Align: Center
			Font: Bold
		Column@SETTINGS_TAB_CONTAINER:
			X: 20
			Y: 50
			Width: 160
			Height: PARENT_HEIGHT - 105
			Spacing: 10
			Children:
				Button@BUTTON_TEMPLATE:
					Width: 160
					Height: 25
					Font: Bold
		Container@PANEL_CONTAINER:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			Children:
				Container@PANEL_TEMPLATE:
					X: 190
					Y: 50
					Width: PARENT_WIDTH - 190 - 20
					Height: PARENT_HEIGHT - 105
		Row@BUTTON_ROW:
			X: 190
			Y: PARENT_HEIGHT - 45
			Width: PARENT_WIDTH - 190 - 20
			Height: 25
			MainAxisAlignment: SpaceBetween
			Children:
				Button@RESET_BUTTON:
					Width: 160
					Height: 25
					Text: button-settings-panel-reset
					Font: Bold
				Button@BACK_BUTTON:
					Width: 160
					Height: 25
					Text: button-back
					Font: Bold
					Key: escape
		TooltipContainer@SETTINGS_TOOLTIP_CONTAINER:
