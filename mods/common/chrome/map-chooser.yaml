		Button@BUTTON1:
			X: 20
			Y: 48
			Height: 31
			Width: 140
			Font: Bold
		Button@BUTTON2:
			X: 160
			Y: 48
			Height: 31
			Width: 140
			Font: Bold
		Button@BUTTON3:
