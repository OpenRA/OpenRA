Container@MAPCHOOSER_GENERATE_PANEL:
	Logic: MapGeneratorLogic
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		Background@MAP_BG:
			X: PARENT_WIDTH - WIDTH
			Width: 370
			Height: 370
			Background: dialog3
			Children:
				GeneratedMapPreview@PREVIEW:
					X: 1
					Y: 1
					Width: PARENT_WIDTH - 2
					Height: PARENT_HEIGHT - 2
		Label@TITLE:
			X: PARENT_WIDTH - WIDTH
			Y: 375
			Width: 370
			Height: 24
			Align: Center
			Text: label-mapchooser-random-map-title
			Font: Bold
		Label@ERROR:
			X: PARENT_WIDTH - WIDTH
			Y: 405
			Width: 370
			Height: 24
			Align: Center
			Text: label-mapchooser-random-map-error-desc
		Label@DETAILS:
			X: PARENT_WIDTH - WIDTH
			Y: 405
			Width: 370
			Height: 24
			Align: Center
		LabelWithTooltip@AUTHOR:
			X: PARENT_WIDTH - WIDTH
			Y: 425
			Width: 370
			Height: 24
			Align: Center
		Label@SIZE:
			X: PARENT_WIDTH - WIDTH
			Y: 445
			Width: 370
			Height: 24
			Align: Center
		Button@BUTTON_GENERATE:
			X: PARENT_WIDTH - 380
			Y: PARENT_HEIGHT + 40
			Width: 120
			Height: 25
			Text: button-mapchooser-random-map-generate
			Font: Bold
		ScrollPanel@SETTINGS_PANEL:
			TopBottomSpacing: 5
			Width: 485
			Height: PARENT_HEIGHT + 30
			Children:
				Container@CHECKBOX_TEMPLATE:
					Width: 230
					Height: 30
					Children:
						Checkbox@CHECKBOX:
							X: 10
							Y: 5
							Width: PARENT_WIDTH - 20
							Height: 20
				Container@TEXT_TEMPLATE:
					Width: 230
					Height: 50
					Children:
						LabelForInput@LABEL:
							X: 10
							Width: PARENT_WIDTH - 20
							Height: 20
							For: INPUT
						TextField@INPUT:
							X: 10
							Y: 20
							Width: PARENT_WIDTH - 20
							Height: 25
				Container@DROPDOWN_TEMPLATE:
					Width: 230
					Height: 50
					Children:
						LabelForInput@LABEL:
							X: 10
							Width: PARENT_WIDTH - 20
							Height: 20
							For: DROPDOWN
						DropDownButton@DROPDOWN:
							X: 10
							Y: 20
							Width: PARENT_WIDTH - 20
							Height: 25
							PanelRoot: DROPDOWN_PANEL_ROOT

ScrollPanel@COMMUNITY_TAGS_PANEL:
	Width: 150
	Height: 55
	ItemSpacing: 5
	TopBottomSpacing: 0
	Children:
		Checkbox@COMMUNITY_TAG_TEMPLATE:
			X: 5
			Y: 5
			Width: PARENT_WIDTH - 29
			Height: 20
